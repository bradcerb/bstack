name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/repo-lint.mjs

  plugin-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [client-services, agent-ops]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - run: npm ci
      - run: npm run check
